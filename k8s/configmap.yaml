apiVersion: v1
kind: ConfigMap
metadata:
  name: metricbeat-config
data:
  metricbeat.yml: |
    metricbeat.modules:
      - module: system
        metricsets: [cpu, load, memory, network, process, process_summary]
        period: 10s
        processes: ['.*']
    output.elasticsearch:
      hosts: ['${ELASTICSEARCH_HOSTS:http://elasticsearch:9200}']
